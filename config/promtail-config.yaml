server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=go-otel"]

    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extract compose project name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

      # Add container ID
      - source_labels: ['__meta_docker_container_id']
        regex: '(.{12})'
        target_label: 'container_id'

    pipeline_stages:
      # Parse JSON logs from the application
      - json:
          expressions:
            level: level
            msg: msg
            timestamp: ts
            caller: caller
            # HTTP request fields
            method: method
            uri: uri
            path: path
            status: status
            latency: latency
            remote_ip: remote_ip
            user_agent: user_agent
            error: error
            # Trace fields
            trace_id: trace_id
            span_id: span_id

      # Extract log level as label
      - labels:
          level:

      # Set timestamp from log entry if available
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000Z0700"
            - "2006-01-02T15:04:05Z0700"

      # Keep all parsed fields in the log line
      - output:
          source: output
