apiVersion: v1
kind: ConfigMap
metadata:
  name: go-otel-api-config
  namespace: default
data:
  APP_NAME: "go-otel-api"
  APP_ENV: "production"
  APP_PORT: "8080"

  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "go_otel_db"
  DB_SSL_MODE: "disable"

  # Database Connection Pool Configuration
  # Sesuaikan dengan jumlah replica dan beban
  DB_MAX_OPEN_CONNS: "25"      # Maksimal koneksi terbuka per pod
  DB_MAX_IDLE_CONNS: "10"      # Koneksi idle yang dijaga per pod
  DB_CONN_MAX_LIFETIME: "5m"   # Lifetime maksimal koneksi
  DB_CONN_MAX_IDLE_TIME: "10m" # Waktu maksimal koneksi idle

  # OpenTelemetry Configuration
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "go-otel-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
  OTEL_EXPORTER_OTLP_INSECURE: "true"

  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
