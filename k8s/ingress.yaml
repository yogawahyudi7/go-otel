apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-otel-api-ingress
  namespace: default
  annotations:
    # Nginx ingress annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Timeout settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # CORS (jika diperlukan)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"

    # Certificate manager (jika menggunakan cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: nginx

  # TLS configuration (uncomment jika sudah setup cert-manager)
  # tls:
  #   - hosts:
  #       - api.yourdomain.com
  #     secretName: go-otel-api-tls

  rules:
    - host: api.yourdomain.com  # Ganti dengan domain Anda
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-otel-api-service
                port:
                  number: 80
